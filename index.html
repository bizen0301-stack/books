    <script>
        const RAKUTEN_ID = "1baffa53.9767f76d.1baffa54.f4870c64";
        const bookData = [];

        // Markdownを解析してデータ化するシステム
        function parseMarkdown() {
            const rawText = document.getElementById('markdown-raw').textContent;
            const lines = rawText.split('\n');
            let currentYear = '';
            let currentSection = 'main';

            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('## 本屋大賞')) {
                    const match = trimmed.match(/## 本屋大賞\s*(\d+)年/);
                    if (match) { currentYear = match[1]; currentSection = 'main'; }
                } else if (trimmed.startsWith('### 翻訳小説部門')) {
                    currentSection = 'translation';
                } else if (trimmed.startsWith('### 発掘部門')) {
                    currentSection = 'discovery';
                }

                if (trimmed.startsWith('|') && !trimmed.includes('---|') && !trimmed.includes('順位') && !trimmed.includes('年 | タイトル')) {
                    const parts = trimmed.split('|').map(p => p.trim());
                    if (parts.length >= 5) {
                        const col1 = parts[1];
                        const title = parts[2];
                        const author = parts[3];
                        const linkPart = parts[4];

                        // Amazonリンク抽出
                        let kindleUrl = '';
                        const urlMatch = linkPart.match(/\((https:\/\/[^)]+)\)/);
                        if (urlMatch) kindleUrl = urlMatch[1];

                        // 楽天Kobo自動リンク生成
                        const searchQuery = encodeURIComponent(`${title} ${author} 電子書籍`);
                        const koboUrl = `https://hb.afl.rakuten.co.jp/ichiba/${RAKUTEN_ID}/?pc=https%3A%2F%2Fsearch.rakuten.co.jp%2Fsearch%2Fmall%2F${searchQuery}%2F`;

                        if (currentSection === 'main') {
                            const rank = parseInt(col1);
                            const category = rank === 1 ? 'grand' : 'nominate';
                            const badge = rank === 1 ? `${currentYear}年 本屋大賞` : `${currentYear}年 第${rank}位`;
                            bookData.push({
                                year: currentYear, title, author, badge, category, kindleUrl, koboUrl,
                                catch: "全国の書店員が選んだ、絶対に失敗しない名作。",
                                story: ["本屋大賞に選ばれた傑作小説。ストーリーに一気に引き込まれ、普段あまり読書をしない方にもおすすめです。"],
                                meta: [f`🏆第{rank}位`, "⏱目安：約4時間"],
                                coverImg: `https://placehold.co/140x200?text=${currentYear}_${rank}`
                            });
                        } else {
                            const badgeName = currentSection === 'translation' ? '翻訳小説部門 1位' : '発掘部門 1位';
                            const metaTag = currentSection === 'translation' ? '🌍海外文学' : '💎隠れた名作';
                            bookData.push({
                                year: col1, title, author, badge: `${col1}年 ${badgeName}`, category: 'department', kindleUrl, koboUrl,
                                catch: "今こそ読みたい、読書好き絶賛の傑作。",
                                story: ["本屋大賞の部門賞を受賞した、間違いのない名著。新しい読書体験を今すぐスマホで。"],
                                meta: [metaTag],
                                coverImg: `https://placehold.co/140x200?text=${col1}_DEPT`
                            });
                        }
                    }
                }
            });
        }

        // 画面描画の処理
        let currentCategory = 'all';
        let currentYear = 'all';

        function initYearSelect() {
            const yearSelect = document.getElementById('year-select');
            const years = [...new Set(bookData.map(b => b.year))].sort((a, b) => b - a);
            years.forEach(year => {
                const opt = document.createElement('option');
                opt.value = year; opt.textContent = `${year}年`;
                yearSelect.appendChild(opt);
            });
        }

        function renderBooks() {
            const container = document.getElementById('book-list');
            container.innerHTML = '';

            const filteredBooks = bookData.filter(book => {
                const matchCategory = (currentCategory === 'all' || book.category === currentCategory);
                const matchYear = (currentYear === 'all' || book.year === currentYear);
                return matchCategory && matchYear;
            });

            if (filteredBooks.length === 0) {
                container.innerHTML = '<div class="no-results">作品が見つかりませんでした。</div>';
                return;
            }

            filteredBooks.forEach(book => {
                const storyList = book.story.map(item => `<li>${item}</li>`).join('');
                const metaSpan = book.meta.map(item => `<span>${item}</span>`).join('');

                container.innerHTML += `
                    <article class="book-card">
                        <span class="badge">${book.badge}</span>
                        <div class="book-cover">
                            <img src="${book.coverImg}" alt="${book.title}">
                        </div>
                        <div class="book-info">
                            <h2>${book.title}</h2>
                            <p class="author">${book.author}</p>
                            <p class="catch">${book.catch}</p>
                            <ul class="story-summary">${storyList}</ul>
                            <div class="book-meta">${metaSpan}</div>
                            <div class="link-buttons">
                                <a href="${book.kindleUrl}" class="btn-link kindle" target="_blank" rel="noopener">Kindle版</a>
                                <a href="${book.koboUrl}" class="btn-link kobo" target="_blank" rel="noopener">楽天Kobo</a>
                            </div>
                        </div>
                    </article>
                `;
            });
        }

        // 起動処理
        parseMarkdown();
        initYearSelect();
        renderBooks();

        // イベント設定
        document.getElementById('category-filters').addEventListener('click', (e) => {
            if (!e.target.classList.contains('btn-filter')) return;
            document.querySelectorAll('#category-filters .btn-filter').forEach(btn => btn.classList.remove('active'));
            e.target.classList.add('active');
            currentCategory = e.target.dataset.category;
            renderBooks();
        });

        document.getElementById('year-select').addEventListener('change', (e) => {
            currentYear = e.target.value;
            renderBooks();
        });
    </script>
</body>
</html>
