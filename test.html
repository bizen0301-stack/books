<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>楽天ブックスAPI 書影取得テスト</title>
<style>
  body { font-family: sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; background: #f9f9f9; }
  h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }

  .info { font-size: 12px; background: #fff3cd; border: 1px solid #ffc107; border-radius: 6px; padding: 10px 14px; margin-bottom: 1.5rem; line-height: 1.8; }
  .info a { color: #c00; }
  code { background: #f0f0f0; padding: 1px 5px; border-radius: 3px; font-size: 11px; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .form-grid label { font-size: 12px; color: #555; display: block; margin-bottom: 3px; font-weight: bold; }
  .form-grid input { width: 100%; padding: 8px 10px; font-size: 13px; border: 1px solid #ccc; border-radius: 6px; font-family: monospace; }

  .search-row { display: flex; gap: 8px; margin-bottom: 1.5rem; }
  .search-row input { flex: 1; padding: 10px 14px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; }
  .search-row button { padding: 10px 24px; background: #bf0000; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
  .search-row button:hover { background: #990000; }

  #status { margin-bottom: 1rem; font-size: 13px; color: #666; min-height: 1.5em; }
  #status.error { color: #c00; font-weight: bold; }
  #status.ok { color: #080; font-weight: bold; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; }
  .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden; font-size: 12px; }
  .cover { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
  .cover-none { width: 100%; aspect-ratio: 2/3; background: #e8e8e8; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #999; text-align: center; padding: 6px; }
  .card-info { padding: 6px 8px 8px; }
  .card-title  { font-weight: bold; line-height: 1.4; margin-bottom: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-author { color: #555; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .card-pub    { color: #999; font-size: 11px; margin-top: 2px; }

  details { margin-top: 2rem; background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 12px; }
  summary { cursor: pointer; font-size: 13px; color: #555; }
  pre { font-size: 11px; overflow: auto; max-height: 320px; margin-top: 8px; white-space: pre-wrap; word-break: break-all; background: #f5f5f5; padding: 10px; border-radius: 4px; }
</style>
</head>
<body>

<h1>📚 楽天ブックスAPI 書影取得テスト</h1>

<div class="info">
  <strong>✅ 正式エンドポイント（公式ドキュメント準拠）：</strong><br>
  <code>https://openapi.rakuten.co.jp/services/api/BooksBook/Search/20170404</code><br><br>
  <strong>⚠️ accessKey が必須です（2026年5月〜）</strong><br>
  <a href="https://webservice.rakuten.co.jp/app/list" target="_blank">Rakuten Developers → アプリ情報の確認</a> から <code>applicationId</code> と <code>accessKey</code> の両方を取得してください。
</div>

<div class="form-grid">
  <div>
    <label>applicationId</label>
    <input type="text" id="appId" value="0ebf5e7f-c440-4465-893f-0b9f1737d3b1">
  </div>
  <div>
    <label>accessKey <span style="color:#c00">（必須）</span></label>
    <input type="text" id="accessKey" placeholder="pk_w4t1wF8ZHMfpK5JFK7MVXW86wI3hMEF5vZSc4ikgUou">
  </div>
</div>

<div class="search-row">
  <input type="text" id="keyword" value="成瀬は天下を取りにいく" placeholder="書名を入力">
  <button onclick="doSearch()">検索</button>
</div>

<div id="status">← accessKey を入力して検索してください</div>
<div class="grid" id="grid"></div>

<details>
  <summary>🛠 APIレスポンス（デバッグ用）</summary>
  <pre id="debug">（まだ検索していません）</pre>
</details>

<script>
// ── JSONP ─────────────────────────────────────────────────────
// 楽天APIはcallbackパラメータでJSONP対応（公式ドキュメントに明記）
let seq = 0;
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const fn = '_rk' + (seq++);
    const el = document.createElement('script');
    const tid = setTimeout(() => { cleanup(); reject(new Error('タイムアウト（10秒）')); }, 10000);
    function cleanup() {
      clearTimeout(tid);
      delete window[fn];
      el.remove();
    }
    window[fn] = data => { cleanup(); resolve(data); };
    el.onerror   = () => { cleanup(); reject(new Error('script読み込み失敗 — URLまたは認証情報を確認してください')); };
    el.src = url + '&callback=' + fn;
    document.head.appendChild(el);
  });
}

// ── 検索 ──────────────────────────────────────────────────────
async function doSearch() {
  const appId     = document.getElementById('appId').value.trim();
  const accessKey = document.getElementById('accessKey').value.trim();
  const keyword   = document.getElementById('keyword').value.trim();
  const status    = document.getElementById('status');
  const grid      = document.getElementById('grid');
  const debug     = document.getElementById('debug');

  if (!appId || !accessKey) {
    alert('applicationId と accessKey を両方入力してください');
    return;
  }
  if (!keyword) { alert('キーワードを入力してください'); return; }

  status.className = '';
  status.textContent = '🔍 検索中…';
  grid.innerHTML = '';
  debug.textContent = '送信中…';

  // 公式ドキュメントに沿ったエンドポイントとパラメータ
  const url =
    'https://openapi.rakuten.co.jp/services/api/BooksBook/Search/20170404' +
    '?applicationId=' + encodeURIComponent(appId) +
    '&accessKey='     + encodeURIComponent(accessKey) +
    '&title='         + encodeURIComponent(keyword) +
    '&hits=30' +
    '&imageFlag=1' +
    '&formatVersion=2' +
    '&format=json';

  try {
    const data = await jsonp(url);

    // デバッグ：先頭1件のみ表示
    debug.textContent = JSON.stringify(
      data.Items ? data.Items[0] : data,
      null, 2
    );

    if (data.error) {
      status.className = 'error';
      status.textContent = `❌ ${data.error}: ${data.error_description}`;
      debug.textContent = JSON.stringify(data, null, 2);
      return;
    }

    const items = (data.Items || []).map(i => i.Item || i);
    if (!items.length) {
      status.className = 'error';
      status.textContent = '該当書籍なし';
      return;
    }

    status.className = 'ok';
    status.textContent = `✅ ${items.length}件取得 / 全${data.count}件 — 書影テスト成功！`;

    grid.innerHTML = items.map(item => {
      const img = item.largeImageUrl || item.mediumImageUrl || item.smallImageUrl || '';
      return `<div class="card">
        ${img ? `<img class="cover" src="${img}" alt="${esc(item.title)}" loading="lazy">`
               : `<div class="cover-none">書影なし</div>`}
        <div class="card-info">
          <div class="card-title">${esc(item.title)}</div>
          <div class="card-author">${esc(item.author || '')}</div>
          <div class="card-pub">${esc(item.publisherName || '')}</div>
        </div>
      </div>`;
    }).join('');

  } catch(err) {
    status.className = 'error';
    status.textContent = `❌ ${err.message}`;
    debug.textContent = err.toString();
  }
}

function esc(s) {
  return String(s || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('keyword').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});
</script>
</body>
</html>
