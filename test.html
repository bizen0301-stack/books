<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>楽天ブックスAPI 書影取得テスト（新API対応）</title>
<style>
  body { font-family: sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; background: #f9f9f9; }
  h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
  .note { font-size: 12px; color: #888; margin-bottom: 1.5rem; background: #fff3cd; border: 1px solid #ffc107; border-radius:6px; padding: 10px 14px; line-height: 1.7; }
  .note a { color: #c00; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .form-grid label { font-size: 12px; color: #555; display: block; margin-bottom: 3px; }
  .form-grid input { width: 100%; padding: 8px 10px; font-size: 13px; border: 1px solid #ccc; border-radius:6px; font-family: monospace; }
  .search-row { display: flex; gap: 8px; margin-bottom: 1.5rem; }
  .search-row input { flex: 1; padding: 10px 14px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; }
  .search-row button { padding: 10px 24px; background: #bf0000; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; white-space: nowrap; }
  .search-row button:hover { background: #990000; }

  #status { margin-bottom: 1rem; font-size: 13px; color: #666; min-height: 1.5em; }
  #status.error { color: #c00; font-weight: bold; }
  #status.ok    { color: #080; font-weight: bold; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px; }
  .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden; font-size: 12px; }
  .cover { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: #eee; }
  .cover-none { width: 100%; aspect-ratio: 2/3; background: #ddd; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #888; text-align: center; padding: 4px; }
  .card-info { padding: 6px 8px 8px; }
  .card-title  { font-weight: bold; line-height: 1.4; margin-bottom: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-author { color: #555; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .card-pub    { color: #999; font-size: 11px; margin-top: 2px; }

  details { margin-top: 2rem; background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 12px; }
  summary { cursor: pointer; font-size: 13px; color: #555; }
  pre { font-size: 11px; overflow: auto; max-height: 320px; margin-top: 8px; white-space: pre-wrap; word-break: break-all; background:#f5f5f5; padding:10px; border-radius:4px; }
</style>
</head>
<body>

<h1>📚 楽天ブックスAPI — 書影取得テスト <small style="font-size:12px;color:#888;">（新API対応版）</small></h1>

<div class="note">
  ⚠️ <strong>2026年5月14日より楽天APIが新仕様に完全移行しました。</strong><br>
  新APIでは <code>applicationId</code>（UUID）に加えて <code>accessKey</code> が必須です。<br>
  <a href="https://webservice.rakuten.co.jp/" target="_blank">Rakuten Developers</a> にログイン →「アプリ情報の確認」で両方の値を確認してください。
</div>

<div class="form-grid">
  <div>
    <label>applicationId（UUID形式）</label>
    <input type="text" id="appId" value="0ebf5e7f-c440-4465-893f-0b9f1737d3b1" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
  </div>
  <div>
    <label>accessKey（新APIで必須）</label>
    <input type="text" id="accessKey" placeholder="Rakuten Developersで確認してください">
  </div>
</div>

<div class="search-row">
  <input type="text" id="keyword" value="成瀬は天下を取りにいく" placeholder="書名・著者名を入力">
  <button onclick="search()">検索</button>
</div>

<div id="status">← キーワードを入力して検索してください</div>
<div class="grid" id="grid"></div>

<details>
  <summary>🛠 APIレスポンス（デバッグ用）</summary>
  <pre id="debug">（まだ検索していません）</pre>
</details>

<script>
// ── JSONP ヘルパー ──────────────────────────────────────────
let cbCount = 0;
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cbName = `_rkCb${cbCount++}`;
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('タイムアウト（10秒）')); }, 10000);
    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = data => { cleanup(); resolve(data); };
    script.src = `${url}&callback=${cbName}`;
    script.onerror = () => { cleanup(); reject(new Error('スクリプト読み込みエラー（ネットワークまたはCORS）')); };
    document.head.appendChild(script);
  });
}

// ── 検索 ──────────────────────────────────────────────────
async function search() {
  const appId     = document.getElementById('appId').value.trim();
  const accessKey = document.getElementById('accessKey').value.trim();
  const keyword   = document.getElementById('keyword').value.trim();
  const status    = document.getElementById('status');
  const grid      = document.getElementById('grid');
  const debug     = document.getElementById('debug');

  if (!appId)    { alert('0ebf5e7f-c440-4465-893f-0b9f1737d3b1'); return; }
  if (!accessKey){ alert('pk_w4t1wF8ZHMfpK5JFK7MVXW86wI3hMEF5vZSc4ikgUou'); return; }
  if (!keyword)  { alert('検索キーワードを入力してください'); return; }

  status.className = '';
  status.textContent = '🔍 検索中…';
  grid.innerHTML = '';
  debug.textContent = 'リクエスト送信中…';

  // 新エンドポイント: openapi.rakuten.co.jp（2026年5月14日〜）
  const apiUrl = [
    'https://openapi.rakuten.co.jp/books/book/search/20240601',
    `?applicationId=${encodeURIComponent(appId)}`,
    `&accessKey=${encodeURIComponent(accessKey)}`,
    `&title=${encodeURIComponent(keyword)}`,
    '&hits=30',
    '&imageFlag=1',
    '&formatVersion=2',
  ].join('');

  try {
    const data = await jsonp(apiUrl);

    // デバッグ: 先頭1件だけ表示
    const sample = Array.isArray(data.Items) ? data.Items[0] : data;
    debug.textContent = JSON.stringify(sample, null, 2);

    if (data.error) {
      status.className = 'error';
      status.textContent = `❌ APIエラー: ${data.error} — ${data.error_description}`;
      debug.textContent = JSON.stringify(data, null, 2);
      return;
    }

    if (!data.Items || data.Items.length === 0) {
      status.className = 'error';
      status.textContent = '該当する書籍が見つかりませんでした。';
      return;
    }

    // formatVersion=2 → Items[] フラット
    const items = data.Items.map(i => i.Item || i);

    status.className = 'ok';
    status.textContent = `✅ ${items.length}件取得成功（全${data.count}件中）— 書影表示テスト OK`;

    grid.innerHTML = items.map(item => {
      const img = item.largeImageUrl || item.mediumImageUrl || item.smallImageUrl || '';
      const cover = img
        ? `<img class="cover" src="${img}" alt="${esc(item.title)}" loading="lazy">`
        : `<div class="cover-none">書影なし</div>`;
      return `<div class="card">
        ${cover}
        <div class="card-info">
          <div class="card-title">${esc(item.title)}</div>
          <div class="card-author">${esc(item.author || '')}</div>
          <div class="card-pub">${esc(item.publisherName || '')}</div>
        </div>
      </div>`;
    }).join('');

  } catch (err) {
    status.className = 'error';
    status.textContent = `❌ エラー: ${err.message}`;
    debug.textContent = err.toString();
  }
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('keyword').addEventListener('keydown', e => {
  if (e.key === 'Enter') search();
});
</script>
</body>
</html>
