<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>楽天ブックスAPI 書影取得テスト</title>
<style>
  body { font-family: sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; background: #f9f9f9; }
  h1 { font-size: 1.4rem; margin-bottom: 1rem; }

  .step { background:#fff; border:1px solid #ddd; border-radius:8px; padding:1rem 1.2rem; margin-bottom:1rem; }
  .step h2 { font-size:13px; color:#555; margin-bottom:.6rem; }
  .step-inner { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  label { font-size:12px; color:#555; white-space:nowrap; }
  input[type=text] { flex:1; min-width:200px; padding:8px 10px; font-size:13px; border:1px solid #ccc; border-radius:6px; font-family:monospace; }
  button { padding:9px 20px; background:#bf0000; color:#fff; border:none; border-radius:6px; font-size:13px; cursor:pointer; white-space:nowrap; }
  button:hover { background:#990000; }
  button.sub { background:#555; }
  button.sub:hover { background:#333; }

  .url-box { background:#f5f5f5; border:1px solid #ddd; border-radius:6px; padding:10px 12px; font-size:11px; font-family:monospace; word-break:break-all; margin-top:.6rem; line-height:1.7; }
  .url-box a { color:#1a73e8; }

  #status { font-size:13px; min-height:1.5em; margin:.5rem 0; padding: 8px 12px; border-radius:6px; }
  #status.ok    { background:#e8f5e9; color:#1b5e20; font-weight:bold; }
  #status.error { background:#fce4e4; color:#b00020; font-weight:bold; }
  #status.info  { background:#e3f2fd; color:#0d47a1; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:14px; margin-top:1rem; }
  .card { background:#fff; border:1px solid #e0e0e0; border-radius:8px; overflow:hidden; font-size:12px; }
  .cover { width:100%; aspect-ratio:2/3; object-fit:cover; display:block; }
  .cover-none { width:100%; aspect-ratio:2/3; background:#eee; display:flex; align-items:center; justify-content:center; font-size:11px; color:#aaa; text-align:center; }
  .card-info { padding:6px 8px 8px; }
  .card-title  { font-weight:bold; line-height:1.4; margin-bottom:2px; display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden; }
  .card-author { color:#666; display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden; }

  details { margin-top:1.5rem; background:#fff; border:1px solid #ddd; border-radius:6px; padding:12px; }
  summary { cursor:pointer; font-size:13px; color:#555; }
  pre { font-size:11px; overflow:auto; max-height:300px; margin-top:8px; white-space:pre-wrap; word-break:break-all; background:#f5f5f5; padding:10px; border-radius:4px; }
</style>
</head>
<body>

<h1>📚 楽天ブックスAPI 書影取得テスト</h1>

<!-- STEP 1: 認証情報 -->
<div class="step">
  <h2>① 認証情報（<a href="https://webservice.rakuten.co.jp/app/list" target="_blank">Rakuten Developers</a> で確認）</h2>
  <div class="step-inner">
    <label>applicationId</label>
    <input type="text" id="appId" value="0ebf5e7f-c440-4465-893f-0b9f1737d3b1" style="max-width:320px">
  </div>
  <div class="step-inner" style="margin-top:8px">
    <label>accessKey</label>
    <input type="text" id="accessKey" placeholder="ここにaccessKeyを貼り付け" style="max-width:320px">
  </div>

  <!-- URLを先に確認できるボタン -->
  <div style="margin-top:10px">
    <button class="sub" onclick="showURL()">▶ まずAPIのURLを確認する（ブラウザで開いて動作確認）</button>
    <div class="url-box" id="url-preview" style="display:none"></div>
  </div>
</div>

<!-- STEP 2: 検索 -->
<div class="step">
  <h2>② 書影を取得する</h2>
  <div class="step-inner">
    <input type="text" id="keyword" value="成瀬は天下を取りにいく" placeholder="書名を入力">
    <button onclick="doSearch()">検索して書影表示</button>
  </div>
</div>

<div id="status" class="info">← accessKeyを入力して検索してください</div>
<div class="grid" id="grid"></div>

<details>
  <summary>🛠 デバッグ（APIレスポンス）</summary>
  <pre id="debug">（まだ検索していません）</pre>
</details>

<script>
// ── ① URLプレビュー：ブラウザで直接開いてJSONを確認できる ──
function showURL() {
  const appId     = document.getElementById('appId').value.trim();
  const accessKey = document.getElementById('accessKey').value.trim();
  const base = 'https://openapi.rakuten.co.jp/services/api/BooksBook/Search/20170404';
  const params = [
    'applicationId=' + encodeURIComponent(appId),
    accessKey ? 'accessKey=' + encodeURIComponent(accessKey) : 'accessKey=【ここに入力】',
    'title=' + encodeURIComponent('成瀬は天下を取りにいく'),
    'hits=1',
    'format=json',
    'formatVersion=2',
  ].join('&');
  const url = base + '?' + params;

  const box = document.getElementById('url-preview');
  box.style.display = 'block';
  box.innerHTML = `
    <strong>このURLをブラウザの別タブで開いてJSONが返るか確認してください：</strong><br>
    <a href="${url}" target="_blank">${url}</a><br><br>
    <strong>✅ 正常なら</strong> <code>{"count":...,"Items":[...]}</code> が返る<br>
    <strong>❌ エラーなら</strong> <code>{"error":"wrong_parameter",...}</code> が返る
  `;
}

// ── ② JSONP 検索 ──────────────────────────────────────────────
let seq = 0;
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const fn  = '_rk' + (seq++);
    const el  = document.createElement('script');
    const tid = setTimeout(() => { cleanup(); reject(new Error('タイムアウト（10秒）')); }, 10000);

    function cleanup() { clearTimeout(tid); delete window[fn]; el.remove(); }

    window[fn] = data => { cleanup(); resolve(data); };

    // script.onerror はHTTPエラー(4xx/5xx)でも発火する
    // → accessKeyが誤り・未入力の場合は400が返りここに来る
    el.onerror = () => {
      cleanup();
      reject(new Error(
        'script読み込み失敗\n' +
        '原因: APIが4xx/5xxを返しました\n' +
        '→ 上の「URLを確認する」ボタンでブラウザからJSONを直接確認してください'
      ));
    };

    el.src = url + '&callback=' + fn;
    document.head.appendChild(el);
  });
}

async function doSearch() {
  const appId     = document.getElementById('appId').value.trim();
  const accessKey = document.getElementById('accessKey').value.trim();
  const keyword   = document.getElementById('keyword').value.trim();
  const status    = document.getElementById('status');
  const grid      = document.getElementById('grid');
  const debug     = document.getElementById('debug');

  if (!accessKey) {
    status.className = 'error';
    status.textContent = '❌ accessKeyが未入力です。Rakuten Developersで確認してください。';
    return;
  }
  if (!keyword) { alert('キーワードを入力してください'); return; }

  status.className = 'info';
  status.textContent = '🔍 検索中…';
  grid.innerHTML = '';

  const url =
    'https://openapi.rakuten.co.jp/services/api/BooksBook/Search/20170404' +
    '?applicationId=' + encodeURIComponent(appId) +
    '&accessKey='     + encodeURIComponent(accessKey) +
    '&title='         + encodeURIComponent(keyword) +
    '&hits=30' +
    '&imageFlag=1' +
    '&formatVersion=2' +
    '&format=json';

  debug.textContent = '送信URL:\n' + url;

  try {
    const data = await jsonp(url);
    debug.textContent = JSON.stringify(data.Items ? data.Items[0] : data, null, 2);

    if (data.error) {
      status.className = 'error';
      status.textContent = `❌ APIエラー [${data.error}]: ${data.error_description}`;
      debug.textContent = JSON.stringify(data, null, 2);
      return;
    }

    const items = (data.Items || []).map(i => i.Item || i);
    if (!items.length) {
      status.className = 'error';
      status.textContent = '検索結果が0件でした。';
      return;
    }

    status.className = 'ok';
    status.textContent = `✅ ${items.length}件取得成功 — 書影テストOK！`;

    grid.innerHTML = items.map(item => {
      const img = item.largeImageUrl || item.mediumImageUrl || item.smallImageUrl || '';
      return `<div class="card">
        ${img
          ? `<img class="cover" src="${img}" alt="${esc(item.title)}" loading="lazy">`
          : `<div class="cover-none">書影なし</div>`}
        <div class="card-info">
          <div class="card-title">${esc(item.title)}</div>
          <div class="card-author">${esc(item.author || '')}</div>
        </div>
      </div>`;
    }).join('');

  } catch(err) {
    status.className = 'error';
    status.textContent = '❌ ' + err.message.split('\n')[0];
    debug.textContent = err.message + '\n\n送信URL:\n' + url;
  }
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('keyword').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});
</script>
</body>
</html>
