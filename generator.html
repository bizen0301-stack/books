        const book = BASE_BOOKS[i];
        progress.innerText = `⏳ 抽出中 (${i + 1} / ${BASE_BOOKS.length}): ${book.title}`;
        
        let coverImg = "";
        const cleanTitle = book.title.replace(/[〜～─━：:・\s\-\[（()）\]]/g, ' ').replace(/[―—■●★▲◆▶✔•…]/g, '').trim();
        const cleanAuthor = book.author.replace(/（[^）]+）/g, '').trim();
        
        try {
            const gUrl = `https://www.googleapis.com/books/v1/volumes?q=intitle:${encodeURIComponent(cleanTitle)}+inauthor:${encodeURIComponent(cleanAuthor)}&maxResults=1&key=${keyField}`;
            const gRes = await fetch(gUrl);
            if (gRes.ok) {
                const gData = await gRes.json();
                if (gData.items && gData.items.length > 0) {
                    const volumeInfo = gData.items[0].volumeInfo;
                    if (volumeInfo.imageLinks) {
                        const rawUrl = volumeInfo.imageLinks.thumbnail || volumeInfo.imageLinks.smallThumbnail;
                        if (rawUrl) coverImg = rawUrl.replace("http:", "https:").replace(/zoom=\d/, "zoom=3");
                    }
                    
                    let isbn = "";
                    if (volumeInfo.industryIdentifiers) {
                        const idfy = volumeInfo.industryIdentifiers.find(id => id.type === "ISBN_13" || id.type === "ISBN_10");
                        if (idfy) isbn = idfy.identifier.replace(/[^0-9X]/g, '');
                    }
                    
                    if (isbn) {
                        const obdRes = await fetch(`https://api.openbd.jp/v1/get?isbn=${isbn}`);
                        if (obdRes.ok) {
                          const obdData = await obdRes.json();
                          if (obdData && obdData[0] && obdData[0].summary && obdData[0].summary.cover) {
                              coverImg = obdData[0].summary.cover;
                          }
                        }
                    }
                }
            }
        } catch (e) {
            console.error("スキップガード:", e);
        }

        resultBooks.push({
            year: book.year,
            rank: book.rank,
            title: book.title,
            author: book.author,
            genre: book.genre,
            media: book.media,
            synopsis: book.synopsis,
            coverImg: coverImg,
            ...(book.audible ? { audible: true } : {})
        });

        await new Promise(resolve => setTimeout(resolve, 1500));
    }

    progress.innerText = "🎉 完了しました！下のコードを丸ごとコピーしてください。";
    output.value = "const BOOKS = " + JSON.stringify(resultBooks, null, 2) + ";";
}
</script>
